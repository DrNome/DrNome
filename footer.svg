<svg width="900" height="110" viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .rain {
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        fill: #00FF41;
        font-weight: bold;
        writing-mode: vertical-rl;
        text-orientation: upright;
        letter-spacing: 3px;
        animation: fall linear infinite;
      }
      @keyframes fall {
        0% { transform: translateY(-130px); opacity: 0; }
        20% { opacity: 0.6; }
        80% { opacity: 0.6; }
        100% { transform: translateY(130px); opacity: 0; }
      }
      .c1 { animation-duration: 3.5s; animation-delay: -1.0s; }
      .c2 { animation-duration: 4.8s; animation-delay: -2.5s; }
      .c3 { animation-duration: 3.1s; animation-delay: -0.4s; }
    </style>
  </defs>

  <rect width="900" height="110" rx="10" class="bg" />

  <text x="40" y="0" class="rain c1">10110010</text>
  <text x="100" y="0" class="rain c2">01001110</text>
  <text x="160" y="0" class="rain c3">11010100</text>
  <text x="220" y="0" class="rain c1">00101101</text>
  <text x="280" y="0" class="rain c2">10011010</text>
  <text x="340" y="0" class="rain c3">01101001</text>
  <text x="400" y="0" class="rain c1">10100110</text>
  <text x="460" y="0" class="rain c2">01011010</text>
  <text x="520" y="0" class="rain c3">11001011</text>
  <text x="580" y="0" class="rain c1">00110100</text>
  <text x="640" y="0" class="rain c2">10110101</text>
  <text x="700" y="0" class="rain c3">01001011</text>
  <text x="760" y="0" class="rain c1">11010010</text>
  <text x="820" y="0" class="rain c2">00101101</text>
  <text x="870" y="0" class="rain c3">10011010</text>
</svg>
