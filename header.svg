<svg width="900" height="250" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .rain {
        font-family: 'Courier New', Courier, monospace;
        font-size: 15px;
        fill: #00FF41;
        font-weight: bold;
        writing-mode: vertical-rl;
        text-orientation: upright;
        letter-spacing: 3px;
        animation: fall linear infinite;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 40px;
        font-weight: 800;
        fill: #ffffff;
        text-anchor: middle;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 600;
        fill: #8b949e;
        text-anchor: middle;
      }
      
      /* Container base do efeito de digitação */
      .typing-container {
        font-family: 'Fira Code', 'Courier New', Courier, monospace;
        font-size: 18px;
        font-weight: bold;
        fill: #00FF41;
      }

      .line {
        opacity: 0;
        overflow: hidden;
        white-space: nowrap;
        animation: cycleLine 20s infinite;
      }

      /* Tempos de cada frase no ciclo de 20s (4s para cada uma) */
      .l1 { animation-delay: 0s; }
      .l2 { animation-delay: 4s; }
      .l3 { animation-delay: 8s; }
      .l4 { animation-delay: 12s; }
      .l5 { animation-delay: 16s; }

      @keyframes cycleLine {
        0% { opacity: 1; width: 0ch; }
        /* Digita o texto ao longo do tempo proporcional ao tamanho */
        12% { opacity: 1; width: 34ch; } 
        /* Mantém visível na tela até apagar */
        17% { opacity: 1; width: 34ch; } 
        17.1% { opacity: 0; width: 0ch; }
        100% { opacity: 0; width: 0ch; }
      }

      /* Cursor piscando */
      .cursor {
        font-family: 'Fira Code', monospace;
        font-size: 18px;
        font-weight: bold;
        fill: #00FF41;
        animation: blink 0.8s infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes fall {
        0% { transform: translateY(-250px); opacity: 0; }
        15% { opacity: 0.4; }
        85% { opacity: 0.4; }
        100% { transform: translateY(270px); opacity: 0; }
      }
      .c1 { animation-duration: 4.5s; animation-delay: -1.2s; }
      .c2 { animation-duration: 6.2s; animation-delay: -3.5s; }
      .c3 { animation-duration: 3.8s; animation-delay: -0.5s; }
      .c4 { animation-duration: 5.5s; animation-delay: -2.8s; }
      .c5 { animation-duration: 4.1s; animation-delay: -4.0s; }
      .c6 { animation-duration: 5.9s; animation-delay: -1.9s; }
    </style>
  </defs>

  <!-- Fundo escuro -->
  <rect width="900" height="250" rx="10" class="bg" />

  <!-- Chuva Matrix no fundo -->
  <text x="35" y="0" class="rain c1">1011001010110</text>
  <text x="95" y="0" class="rain c3">0100111010011</text>
  <text x="155" y="0" class="rain c2">1101010011010</text>
  <text x="215" y="0" class="rain c5">0010110101101</text>
  <text x="275" y="0" class="rain c4">1001101010010</text>
  <text x="335" y="0" class="rain c6">0110100111011</text>
  <text x="395" y="0" class="rain c1">1010011010100</text>
  <text x="455" y="0" class="rain c3">0101101001011</text>
  <text x="515" y="0" class="rain c5">1100101101001</text>
  <text x="575" y="0" class="rain c2">0011010011100</text>
  <text x="635" y="0" class="rain c4">1011010100110</text>
  <text x="695" y="0" class="rain c6">0100101101011</text>
  <text x="755" y="0" class="rain c1">1101001011001</text>
  <text x="815" y="0" class="rain c3">0010110100110</text>
  <text x="865" y="0" class="rain c5">1001101011010</text>

  <!-- Caixa translúcida para leitura nítida -->
  <rect x="130" y="42" width="640" height="166" rx="10" fill="#0d1117" opacity="0.82" />

  <!-- Título e subtítulo fixos -->
  <text x="450" y="95" class="title">Hello, world! 🫡</text>
  <text x="450" y="125" class="subtitle">Jhean Carllos | Software Engineering Student</text>

  <!-- Frases com efeito de digitação CMD letra por letra -->
  <g transform="translate(230, 173)" class="typing-container">
    <text x="0" y="0" class="line l1">> Software Engineering Student</text>
    <text x="0" y="0" class="line l2">> Yggdra Tech Founder | IT Services</text>
    <text x="0" y="0" class="line l3">> Node.js, Java & SQL Enthusiast</text>
    <text x="0" y="0" class="line l4">> One Piece Fan & Tereré Lover</text>
    <text x="0" y="0" class="line l5">> Building the future in Goiás</text>
  </g>
</svg>
